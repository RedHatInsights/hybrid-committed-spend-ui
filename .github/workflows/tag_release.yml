name: Tag Release
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Release commit SHA deployed to prod'
        required: true

permissions:
  contents: write

jobs:
  tag_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.commit }}
      - name: Tag this release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          DATE=$(date +"%Y.%m.%d")
          PREV_RELEASE=$(git tag --list | grep -E "^r\.[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$" | tail -1 || true)
          PREV_SAME_DAY=$(git tag --list | grep -E "^r\.${DATE}\.[0-9]+$" | tail -1 || true)
          MINOR_VERSION=0
          if [ -n "$PREV_SAME_DAY" ]; then
            MINOR_VERSION=$(echo "$PREV_SAME_DAY" | cut -d'.' -f5)
            MINOR_VERSION=$((MINOR_VERSION+1))
          fi
          TAG="r.$DATE.$MINOR_VERSION"
          echo "PREV_RELEASE=$PREV_RELEASE"
          echo "PREV_SAME_DAY=$PREV_SAME_DAY"
          echo "TAG=$TAG"
          git config --local user.email "hcs-ui-bot@redhat.com"
          git config --local user.name "HCS UI Bot"
          if [ -n "$PREV_RELEASE" ]; then
            BODY=$(git log "$PREV_RELEASE".."$RELEASE_COMMIT")
            if [ -n "$BODY" ]; then
              echo "$BODY" | git tag -a "$TAG" "$RELEASE_COMMIT" -F -
            else
              git tag -a "$TAG" "$RELEASE_COMMIT" -m "Release $TAG"
            fi
          else
            git tag -a "$TAG" "$RELEASE_COMMIT" -m "Release $TAG"
          fi
          git push origin "$TAG"
        shell: bash
